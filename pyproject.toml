[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reasonhound"
version = "0.0.1"
description = "AI-assisted security scanner that reasons like a senior researcher."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yigit Erdogan", email = "yigiterdogan023@gmail.com" }]
keywords = ["security", "scanner", "llm", "sast", "dast", "byok"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12",           # CLI wizard
  "questionary>=2.0",      # interactive startup prompts
  "textual>=0.60",         # live multi-pane TUI monitor
  "httpx>=0.27",           # BYOK provider adapters + harmless HTTP probes
  "pydantic>=2.7",         # config + finding schemas
  "tomli-w>=1.0",          # write .reasonhound.toml
  "tree-sitter>=0.21",     # hybrid static engine: multi-language parsing
  "tree-sitter-language-pack>=0.2",  # grammars for the tree-sitter engine
]

[project.optional-dependencies]
# Phase 2 (dynamic): bring the target app up in an isolated, egress-locked container.
dynamic = [
  "docker>=7.0",
]
# Frontend/JS deep phase: headless-browser detonation, DOM XSS, bundle analysis.
frontend = [
  "playwright>=1.44",
]
# Everything.
all = [
  "reasonhound[dynamic]",
  "reasonhound[frontend]",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
reasonhound = "reasonhound.cli.app:main"

[project.urls]
Homepage = "https://github.com/Yigtwxx/Reasonhound"
Repository = "https://github.com/Yigtwxx/Reasonhound"
Issues = "https://github.com/Yigtwxx/Reasonhound/issues"
Changelog = "https://github.com/Yigtwxx/Reasonhound/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/reasonhound"]

[tool.hatch.build.targets.sdist]
include = ["src/reasonhound", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.ruff.lint.isort]
known-first-party = ["reasonhound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
